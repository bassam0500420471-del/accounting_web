{% extends "layout/base.html" %}

{% block content %}
<div class="container">
    <h2 class="fw-bold mb-4">لوحة التحكم</h2>

    <div class="card p-4 mb-4">
        <h4 class="mb-3">آخر الفواتير</h4>

        {% if invoices %}
            <ul class="list-group">
            {% for inv in invoices %}
                <li class="list-group-item">
                    فاتورة رقم {{ inv.invoice_no }} — {{ inv.total_after_tax }} ريال
                </li>
            {% endfor %}
            </ul>
        {% else %}
            <p>لا توجد فواتير حتى الآن.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
