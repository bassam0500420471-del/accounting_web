{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ERP{% endblock %}</title>

<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: "Segoe UI", Tahoma, Arial;
    background:#f4f6fb;
    min-height:100vh;
  }

  .split{
    min-height:100vh;
    display:grid;
    grid-template-columns: 1.05fr 0.95fr;
  }

  @media (max-width: 992px){
    .split{grid-template-columns:1fr;}
    .side{display:none;}
    .main{padding:28px 16px;}
  }

  /* Left/Right side like Daftra */
  .side{
    background: radial-gradient(900px 500px at 30% 30%, rgba(37,99,235,.22), transparent 60%),
                radial-gradient(900px 500px at 70% 60%, rgba(79,70,229,.18), transparent 60%),
                linear-gradient(135deg,#0b1b3a,#101a3a 55%, #0b1b3a);
    color:#fff;
    padding:48px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:18px;
    position:relative;
    overflow:hidden;
  }

  .side:after{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(300px 300px at 80% 20%, rgba(255,255,255,.08), transparent 60%),
      radial-gradient(260px 260px at 15% 75%, rgba(255,255,255,.06), transparent 60%);
    pointer-events:none;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }

  .brand-logo{
    width:44px;height:44px;border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    box-shadow:0 18px 40px rgba(37,99,235,.35);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;
  }
  .brand-title{font-weight:800;font-size:18px;line-height:1.2}
  .brand-sub{opacity:.8;font-size:12px}

  .headline{
    font-size:34px;
    font-weight:900;
    margin:0;
    position:relative;
    z-index:1;
  }
  .desc{
    margin:0;
    opacity:.85;
    line-height:1.9;
    font-size:14px;
    max-width:460px;
    position:relative;
    z-index:1;
  }

  .mini-card{
    margin-top:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    padding:14px 16px;
    border-radius:14px;
    position:relative;
    z-index:1;
    max-width:520px;
  }
  .mini-card b{display:block;margin-bottom:6px}

  /* Simple modern anime-ish illustration (SVG) */
  .illus{
    margin-top:20px;
    width:100%;
    max-width:520px;
    position:relative;
    z-index:1;
    filter: drop-shadow(0 25px 45px rgba(0,0,0,.25));
  }

  /* Main form side */
  .main{
    padding:48px 40px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:18px;
    box-shadow: 0 30px 70px rgba(16,24,40,.12);
    padding:28px;
  }

  .card h2{margin:0 0 8px 0;font-weight:900;font-size:22px}
  .card p{margin:0 0 20px 0;color:#6b7280;font-size:13px;line-height:1.8}

  label{display:block;font-weight:700;margin:12px 0 6px 0;font-size:13px;color:#111827}

  input{
    width:100%;
    padding:12px 12px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    outline:none;
    font-size:14px;
    background:#fff;
    transition:.2s;
  }
  input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width: 520px){ .grid{grid-template-columns:1fr;} }

  .btn{
    margin-top:16px;
    width:100%;
    padding:12px 14px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    font-weight:800;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:#fff;
    transition:.2s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 30px rgba(37,99,235,.22);}

  .link{
    margin-top:14px;
    text-align:center;
    font-size:13px;
    color:#6b7280;
  }
  .link a{color:#2563eb; text-decoration:none; font-weight:800}

  .err{color:#dc2626;font-size:12px;margin-top:6px}
  .alert{
    background:#fee2e2;
    border:1px solid #fecaca;
    color:#991b1b;
    padding:10px 12px;
    border-radius:12px;
    margin-bottom:12px;
    font-size:13px;
  }

  /* Waving hand */
  .wave-hand{
    transform-origin: 350px 205px;
    animation: wave 1.3s ease-in-out infinite;
  }
  @keyframes wave{
    0%{transform:rotate(0)}
    25%{transform:rotate(12deg)}
    50%{transform:rotate(-10deg)}
    75%{transform:rotate(12deg)}
    100%{transform:rotate(0)}
  }
</style>

{% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
