{% extends "layout/base.html" %}
{% load static %}

{% block title %}إضافة مورد{% endblock %}

{% block content %}

<h3 class="mb-4">إضافة مورد</h3>

<div class="card p-4">

<form method="POST"
      enctype="multipart/form-data"
      action="?{% if request.GET.return %}return={{ request.GET.return }}{% endif %}">
    {% csrf_token %}

    <div class="row">

        <!-- ================= بيانات المورد ================= -->
        <div class="col-md-6">

            <h5 class="mb-3">بيانات المورد</h5>

            <div class="mt-3">
                <label>الاسم التجاري *</label>
                <input name="commercial_name"
                       class="form-control"
                       required>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الاسم الأول</label>
                    <input name="first_name"
                           class="form-control">
                </div>
                <div class="col">
                    <label>الاسم الأخير</label>
                    <input name="last_name"
                           class="form-control">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الهاتف</label>
                    <input name="phone"
                           class="form-control">
                </div>
                <div class="col">
                    <label>جوال</label>
                    <input name="mobile"
                           class="form-control">
                </div>
            </div>

            <div class="mt-3">
                <label>عنوان الشارع 1</label>
                <input name="street1"
                       class="form-control">
            </div>

            <div class="mt-3">
                <label>عنوان الشارع 2</label>
                <input name="street2"
                       class="form-control">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>المدينة</label>
                    <input name="city"
                           class="form-control">
                </div>
                <div class="col">
                    <label>المنطقة</label>
                    <input name="region"
                           class="form-control">
                </div>
                <div class="col">
                    <label>الرمز البريدي</label>
                    <input name="postal_code"
                           class="form-control">
                </div>
            </div>

            <div class="mt-3">
                <label>البلد</label>
                <input name="country"
                       value="المملكة العربية السعودية (SA)"
                       class="form-control">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الرقم الضريبي (اختياري)</label>
                    <input name="tax_number"
                           class="form-control">
                </div>
                <div class="col">
                    <label>سجل تجاري (اختياري)</label>
                    <input name="cr_number"
                           class="form-control">
                </div>
            </div>

        </div>

        <!-- ================= بيانات إضافية ================= -->
        <div class="col-md-6">

            <h5 class="mb-3">بيانات إضافية</h5>

            <label>البريد الإلكتروني</label>
            <input name="email"
                   class="form-control">

            <div class="mt-3">
                <label>الرصيد الافتتاحي</label>
                <input type="number"
                       step="0.01"
                       name="opening_balance"
                       class="form-control">
            </div>

            <div class="mt-3">
                <label>الملاحظات</label>
                <textarea name="notes"
                          class="form-control"
                          rows="4"></textarea>
            </div>

            <div class="mt-3">
                <label>المرفقات</label>
                <input type="file"
                       name="attachment"
                       class="form-control">
            </div>

        </div>

    </div>

    <div class="mt-4 text-end">
        <button type="submit"
                class="btn"
                style="background:#6c757d; color:white; border-radius:6px;">
            حفظ
        </button>
        <a href="/suppliers/"
           class="btn btn-secondary">
            إلغاء
        </a>
    </div>

</form>

</div>

{% endblock %}
