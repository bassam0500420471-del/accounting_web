{% extends "layout/base.html" %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "Add Supplier" %}{% endblock %}

{% block content %}

<h3 class="mb-4">{% trans "Add Supplier" %}</h3>

<div class="card p-4">

<form method="POST"
      enctype="multipart/form-data"
      action="?{% if request.GET.return %}return={{ request.GET.return }}{% endif %}">
    {% csrf_token %}

    <div class="row">

        <!-- ================= Supplier Information ================= -->
        <div class="col-md-6">

            <h5 class="mb-3">{% trans "Supplier Information" %}</h5>

            <div class="mt-3">
                <label>{% trans "Commercial Name" %} *</label>
                <input name="commercial_name"
                       class="form-control"
                       required>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>{% trans "First Name" %}</label>
                    <input name="first_name"
                           class="form-control">
                </div>
                <div class="col">
                    <label>{% trans "Last Name" %}</label>
                    <input name="last_name"
                           class="form-control">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>{% trans "Phone" %}</label>
                    <input name="phone"
                           class="form-control">
                </div>
                <div class="col">
                    <label>{% trans "Mobile" %}</label>
                    <input name="mobile"
                           class="form-control">
                </div>
            </div>

            <div class="mt-3">
                <label>{% trans "Street Address 1" %}</label>
                <input name="street1"
                       class="form-control">
            </div>

            <div class="mt-3">
                <label>{% trans "Street Address 2" %}</label>
                <input name="street2"
                       class="form-control">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>{% trans "City" %}</label>
                    <input name="city"
                           class="form-control">
                </div>
                <div class="col">
                    <label>{% trans "Region" %}</label>
                    <input name="region"
                           class="form-control">
                </div>
                <div class="col">
                    <label>{% trans "Postal Code" %}</label>
                    <input name="postal_code"
                           class="form-control">
                </div>
            </div>

            <div class="mt-3">
                <label>{% trans "Country" %}</label>
                <input name="country"
                       value="{% trans 'Saudi Arabia (SA)' %}"
                       class="form-control">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>{% trans "Tax Number (Optional)" %}</label>
                    <input name="tax_number"
                           class="form-control">
                </div>
                <div class="col">
                    <label>{% trans "CR Number (Optional)" %}</label>
                    <input name="cr_number"
                           class="form-control">
                </div>
            </div>

        </div>

        <!-- ================= Additional Information ================= -->
        <div class="col-md-6">

            <h5 class="mb-3">{% trans "Additional Information" %}</h5>

            <label>{% trans "Email" %}</label>
            <input name="email"
                   class="form-control">

            <div class="mt-3">
                <label>{% trans "Opening Balance" %}</label>
                <input type="number"
                       step="0.01"
                       name="opening_balance"
                       class="form-control">
            </div>

            <div class="mt-3">
                <label>{% trans "Notes" %}</label>
                <textarea name="notes"
                          class="form-control"
                          rows="4"></textarea>
            </div>

            <div class="mt-3">
                <label>{% trans "Attachments" %}</label>
                <input type="file"
                       name="attachment"
                       class="form-control">
            </div>

        </div>

    </div>

    <div class="mt-4 text-end">
        <button type="submit"
                class="btn"
                style="background:#6c757d; color:white; border-radius:6px;">
            {% trans "Save" %}
        </button>
        <a href="/suppliers/"
           class="btn btn-secondary">
            {% trans "Cancel" %}
        </a>
    </div>

</form>

</div>

{% endblock %}
