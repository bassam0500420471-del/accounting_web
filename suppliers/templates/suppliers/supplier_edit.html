{% extends "layout/base.html" %}
{% load static %}

{% block title %}تعديل مورد{% endblock %}

{% block content %}

<style>
/* ===== Select2 RTL تحسين ===== */
.select2-container--default .select2-selection--single {
    height: 42px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ced4da;
    text-align: right;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 28px;
    padding-right: 8px;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 40px;
    left: 6px;
    right: auto;
}

.select2-dropdown {
    direction: rtl;
    text-align: right;
    font-size: 15px;
}
</style>

<h3 class="mb-4">تعديل مورد</h3>

<div class="card p-4">

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="row">

        <!-- ========== بيانات المورد ========== -->
        <div class="col-md-6">

            <h5 class="mb-3">بيانات المورد</h5>

            <div class="mt-3">
                <label>الاسم التجاري *</label>
                <input name="commercial_name"
                       class="form-control"
                       value="{{ supplier.commercial_name }}"
                       required>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الاسم الأول</label>
                    <input name="first_name"
                           class="form-control"
                           value="{{ supplier.first_name }}">
                </div>
                <div class="col">
                    <label>الاسم الأخير</label>
                    <input name="last_name"
                           class="form-control"
                           value="{{ supplier.last_name }}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الهاتف</label>
                    <input name="phone"
                           class="form-control"
                           value="{{ supplier.phone }}">
                </div>
                <div class="col">
                    <label>جوال</label>
                    <input name="mobile"
                           class="form-control"
                           value="{{ supplier.mobile }}">
                </div>
            </div>

            <div class="mt-3">
                <label>عنوان الشارع 1</label>
                <input name="street1"
                       class="form-control"
                       value="{{ supplier.street1 }}">
            </div>

            <div class="mt-3">
                <label>عنوان الشارع 2</label>
                <input name="street2"
                       class="form-control"
                       value="{{ supplier.street2 }}">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>المدينة</label>
                    <input name="city"
                           class="form-control"
                           value="{{ supplier.city }}">
                </div>
                <div class="col">
                    <label>المنطقة</label>
                    <input name="region"
                           class="form-control"
                           value="{{ supplier.region }}">
                </div>
                <div class="col">
                    <label>الرمز البريدي</label>
                    <input name="postal_code"
                           class="form-control"
                           value="{{ supplier.postal_code }}">
                </div>
            </div>

            <div class="mt-3">
                <label>البلد</label>
                <input name="country"
                       class="form-control"
                       value="{{ supplier.country }}">
            </div>

            <div class="row mt-3">
                <div class="col">
                    <label>الرقم الضريبي (اختياري)</label>
                    <input name="tax_number"
                           class="form-control"
                           value="{{ supplier.tax_number }}">
                </div>
                <div class="col">
                    <label>سجل تجاري (اختياري)</label>
                    <input name="cr_number"
                           class="form-control"
                           value="{{ supplier.cr_number }}">
                </div>
            </div>

        </div>

        <!-- ========== بيانات الحساب ========== -->
        <div class="col-md-6">

            <h5 class="mb-3">بيانات الحساب</h5>

            <!-- ✅ حساب المورد (ذمم دائنة + بحث + تحديد تلقائي) -->
            <div class="mb-3">
                <label class="fw-bold">حساب المورد (ذمم دائنة) *</label>
                <select name="account"
                        id="supplier_account"
                        class="form-select"
                        required>
                    <option value="">-- اختر حساب المورد --</option>

                    {% for acc in accounts %}
                        <option value="{{ acc.id }}"
                            {% if supplier.account_id == acc.id %}selected{% endif %}>
                            {{ acc.code }} - {{ acc.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <label>البريد الإلكتروني</label>
            <input name="email"
                   class="form-control"
                   value="{{ supplier.email }}">

            <div class="mt-3">
                <label>الرصيد الافتتاحي</label>
                <input type="number" step="0.01"
                       name="opening_balance"
                       class="form-control"
                       value="{{ supplier.opening_balance }}">

                <label class="mt-2">الملاحظات</label>
                <textarea name="notes"
                          class="form-control"
                          rows="4">{{ supplier.notes }}</textarea>
            </div>

            <div class="mt-3">
                <label>المرفقات</label>
                <input type="file"
                       name="attachment"
                       class="form-control">
            </div>

        </div>

    </div>

    <div class="mt-4 text-end">
        <button type="submit"
                class="btn"
                style="background:#6c757d; color:white; border-radius:6px;">
            حفظ التعديل
        </button>
        <a href="/suppliers/" class="btn btn-secondary">
            إلغاء
        </a>
    </div>

</form>

</div>

{% endblock %}

{% block scripts %}
<!-- ✅ jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ✅ Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function () {
    $('#supplier_account').select2({
        placeholder: "-- اختر حساب المورد --",
        allowClear: true,
        width: '100%',
        dir: "rtl",
        minimumResultsForSearch: 0
    });
});
</script>
{% endblock %}
