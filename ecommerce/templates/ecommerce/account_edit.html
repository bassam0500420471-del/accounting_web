{% extends "ecommerce/base_store.html" %}


{% block title %}
    تعديل البيانات
{% endblock %}


{% block content %}

<style>

/* ==========================================================
   ACCOUNT EDIT PAGE
   3D MODERN DESIGN
   ========================================================== */

.account-page {

    direction: rtl;

    background:
        linear-gradient(
            135deg,
            #eeeeee 0%,
            #dcdcdc 50%,
            #f7f7f7 100%
        );

    min-height: calc(100vh - 80px);

    font-family: Tahoma, Arial, sans-serif;

    padding: 40px 0;
}


/* ==========================================================
   MAIN CONTAINER
   ========================================================== */

.account-edit-container {

    max-width: 850px;

    margin: 0 auto;

    padding: 0 15px;
}


/* ==========================================================
   MAIN CARD
   ========================================================== */

.edit-card {

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border-radius: 20px;

    border: 1px solid #dddddd;

    box-shadow:
        5px 8px 20px rgba(0,0,0,0.12),
        -4px -4px 10px rgba(255,255,255,0.90);

    overflow: hidden;
}


/* ==========================================================
   HEADER
   ========================================================== */

.edit-header {

    padding: 24px 28px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border-bottom: 1px solid #dcdcdc;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.06);
}


.edit-header h4 {

    margin: 0;

    font-size: 25px;

    font-weight: bold;

    color: #222;

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 3px rgba(0,0,0,0.08);
}


/* ==========================================================
   BODY
   ========================================================== */

.edit-body {

    padding: 28px;
}


/* ==========================================================
   ALERTS
   ========================================================== */

.edit-alert {

    border-radius: 11px;

    border: 1px solid #d8d8d8;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    box-shadow:
        2px 4px 8px rgba(0,0,0,0.07);

    padding: 12px 15px;

    margin-bottom: 15px;

    color: #555;

    font-size: 13px;
}


/* ==========================================================
   FORM GROUP
   ========================================================== */

.edit-form-group {

    margin-bottom: 20px;
}


/* ==========================================================
   LABEL
   ========================================================== */

.edit-form-label {

    display: block;

    margin-bottom: 8px;

    color: #555;

    font-size: 13px;

    font-weight: bold;
}


/* ==========================================================
   INPUT
   ========================================================== */

.edit-input {

    width: 100%;

    min-height: 46px;

    padding: 10px 13px;

    border-radius: 11px;

    border: 1px solid #d3d3d3;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    box-shadow:
        inset 2px 2px 5px rgba(0,0,0,0.06),
        inset -2px -2px 5px rgba(255,255,255,0.90),
        2px 3px 7px rgba(0,0,0,0.05);

    color: #333;

    font-family: Tahoma, Arial, sans-serif;

    font-size: 14px;

    direction: rtl;

    text-align: right;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


.edit-input:focus {

    border-color: #999;

    outline: none;

    box-shadow:
        inset 2px 2px 5px rgba(0,0,0,0.07),
        0 0 0 3px rgba(0,0,0,0.06);
}


/* ==========================================================
   DISABLED INPUT
   ========================================================== */

.edit-input:disabled {

    background:
        linear-gradient(
            145deg,
            #e9e9e9,
            #dddddd
        );

    color: #777;

    cursor: not-allowed;

    box-shadow:
        inset 2px 2px 5px rgba(0,0,0,0.08);
}


/* ==========================================================
   HELP TEXT
   ========================================================== */

.edit-help {

    display: block;

    margin-top: 7px;

    color: #888;

    font-size: 12px;
}


/* ==========================================================
   DIVIDER
   ========================================================== */

.edit-divider {

    margin: 25px 0;

    border: 0;

    border-top: 1px solid #d5d5d5;

    opacity: 1;
}


/* ==========================================================
   ACTIONS
   ========================================================== */

.edit-actions {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;
}


/* ==========================================================
   SAVE BUTTON
   ========================================================== */

.edit-save-btn {

    min-height: 45px;

    padding: 10px 20px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #333333,
            #111111
        );

    color: #ffffff;

    font-family: Tahoma, Arial, sans-serif;

    font-size: 13px;

    font-weight: bold;

    box-shadow:
        3px 5px 10px rgba(0,0,0,0.22);

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.edit-save-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        5px 8px 15px rgba(0,0,0,0.28);

    color: #ffffff;
}


.edit-save-btn:active {

    transform: translateY(1px);

    box-shadow:
        2px 3px 6px rgba(0,0,0,0.20);
}


/* ==========================================================
   CANCEL BUTTON
   ========================================================== */

.edit-cancel-btn {

    min-height: 45px;

    padding: 10px 20px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dddddd
        );

    border: 1px solid #cfcfcf;

    color: #333;

    text-decoration: none;

    font-family: Tahoma, Arial, sans-serif;

    font-size: 13px;

    font-weight: bold;

    box-shadow:
        3px 5px 9px rgba(0,0,0,0.12);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.edit-cancel-btn:hover {

    color: #222;

    transform: translateY(-2px);

    box-shadow:
        4px 7px 12px rgba(0,0,0,0.16);
}


.edit-cancel-btn:active {

    transform: translateY(1px);
}


/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width: 767px) {

    .account-page {

        padding-top: 20px;

        padding-bottom: 20px;
    }


    .account-edit-container {

        padding-left: 12px;

        padding-right: 12px;
    }


    .edit-card {

        border-radius: 16px;
    }


    .edit-header {

        padding: 20px;
    }


    .edit-header h4 {

        font-size: 22px;
    }


    .edit-body {

        padding: 18px;
    }


    .edit-actions {

        flex-direction: column;
    }


    .edit-save-btn,
    .edit-cancel-btn {

        width: 100%;

        text-align: center;
    }

}

</style>


<div class="account-page">


    <div class="account-edit-container">


        <div class="edit-card">


            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <div class="edit-header">

                <h4>

                    ✏️ تعديل البيانات

                </h4>

            </div>


            <!-- =====================================================
                 BODY
            ====================================================== -->

            <div class="edit-body">


                <!-- =================================================
                     MESSAGES
                ================================================== -->

                {% if messages %}

                    {% for message in messages %}

                        <div class="edit-alert">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}


                <!-- =================================================
                     FORM
                ================================================== -->

                <form method="post">

                    {% csrf_token %}


                    <!-- =================================================
                         الاسم الأول
                    ================================================== -->

                    <div class="edit-form-group">

                        <label class="edit-form-label">

                            الاسم الأول

                        </label>


                        <input
                            type="text"
                            name="first_name"
                            class="edit-input"
                            value="{{ user.first_name }}"
                        >

                    </div>


                    <!-- =================================================
                         اسم العائلة
                    ================================================== -->

                    <div class="edit-form-group">

                        <label class="edit-form-label">

                            اسم العائلة

                        </label>


                        <input
                            type="text"
                            name="last_name"
                            class="edit-input"
                            value="{{ user.last_name }}"
                        >

                    </div>


                    <!-- =================================================
                         اسم المستخدم
                    ================================================== -->

                    <div class="edit-form-group">

                        <label class="edit-form-label">

                            اسم المستخدم

                        </label>


                        <input
                            type="text"
                            class="edit-input"
                            value="{{ user.username }}"
                            disabled
                        >


                        <small class="edit-help">

                            لا يمكن تعديل اسم المستخدم من هذه الصفحة.

                        </small>

                    </div>


                    <!-- =================================================
                         البريد الإلكتروني
                    ================================================== -->

                    <div class="edit-form-group">

                        <label class="edit-form-label">

                            البريد الإلكتروني

                        </label>


                        <input
                            type="email"
                            name="email"
                            class="edit-input"
                            value="{{ user.email }}"
                        >

                    </div>


                    <hr class="edit-divider">


                    <!-- =================================================
                         ACTIONS
                    ================================================== -->

                    <div class="edit-actions">


                        <button
                            type="submit"
                            class="edit-save-btn"
                        >

                            💾 حفظ التعديلات

                        </button>


                        <a
                            href="{% url 'ecommerce:account' store.slug %}"
                            class="edit-cancel-btn"
                        >

                            إلغاء

                        </a>


                    </div>


                </form>


            </div>


        </div>


    </div>


</div>


{% endblock %}
