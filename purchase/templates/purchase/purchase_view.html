{% extends "layout/base.html" %}
{% block content %}

<div class="container mt-4">

    <h3 class="fw-bold text-center mb-4">
        إنشاء إشعار مدين (مرتجع)
    </h3>

    <!-- =========================
         اختيار المورد
    ========================== -->
    <div class="mb-3">
        <label class="fw-bold">اختر المورد:</label>
        <select id="supplierSelect" class="form-select">
            <option value="">-- اختر المورد --</option>
            {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">
                    {{ supplier.commercial_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- =========================
         اختيار الفاتورة
    ========================== -->
    <div class="mb-4">
        <label class="fw-bold">اختر الفاتورة:</label>
        <select id="invoiceSelect" class="form-select">
            <option value="">-- اختر الفاتورة --</option>
        </select>
    </div>

    <!-- =========================
         بيانات الفاتورة (عرض مبسط)
    ========================== -->
    <div id="invoiceData" style="display:none;">

        <div class="row mb-3">
            <div class="col">
                <label class="fw-bold">رقم الفاتورة:</label>
                <input type="text" id="invoiceNo" class="form-control" readonly>
            </div>
            <div class="col">
                <label class="fw-bold">تاريخ الفاتورة:</label>
                <input type="text" id="invoiceDate" class="form-control" readonly>
            </div>
        </div>

        <table class="table table-bordered text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>الصنف</th>
                    <th>الكمية</th>
                    <th>السعر</th>
                    <th>% الضريبة</th>
                    <th>الخصم</th>
                    <th>الإجمالي</th>
                </tr>
            </thead>
            <tbody id="itemsTable">
            </tbody>
        </table>

        <button
            class="btn btn-secondary w-100 mt-3"
            type="button"
            onclick="goToCreateReturn()">
            متابعة إنشاء المرتجع
        </button>

    </div>

</div>

<!-- =========================
     JavaScript
========================== -->
<script>
const supplierSelect = document.getElementById("supplierSelect");
const invoiceSelect  = document.getElementById("invoiceSelect");
const invoiceData    = document.getElementById("invoiceData");
const itemsTable     = document.getElementById("itemsTable");

supplierSelect.addEventListener("change", function () {
    const supplierId = this.value;
    invoiceSelect.innerHTML = '<option value="">-- اختر الفاتورة --</option>';
    invoiceData.style.display = "none";

    if (!supplierId) return;

    fetch(`/purchase/api/invoices-by-supplier/?supplier_id=${supplierId}`)
        .then(res => res.json())
        .then(data => {
            data.invoices.forEach(inv => {
                const opt = document.createElement("option");
                opt.value = inv.id;
                opt.textContent = `فاتورة رقم ${inv.invoice_no} | ${inv.date} | ${inv.total}`;
                invoiceSelect.appendChild(opt);
            });
        });
});

invoiceSelect.addEventListener("change", function () {
    const invoiceId = this.value;
    invoiceData.style.display = "none";
    itemsTable.innerHTML = "";

    if (!invoiceId) return;

    fetch(`/purchase/api/invoice-data/?invoice_id=${invoiceId}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("invoiceNo").value   = data.invoice.invoice_no;
            document.getElementById("invoiceDate").value = data.invoice.date;

            data.invoice.items.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.product}</td>
                        <td>${item.qty}</td>
                        <td>${item.price}</td>
                        <td>${item.tax}</td>
                        <td>${item.discount}</td>
                        <td>${item.total}</td>
                    </tr>
                `;
                itemsTable.insertAdjacentHTML("beforeend", row);
            });

            invoiceData.style.display = "block";
        });
});

function goToCreateReturn() {
    const invoiceId = invoiceSelect.value;
    if (!invoiceId) {
        alert("الرجاء اختيار فاتورة أولاً");
        return;
    }
    window.location.href = `/purchase/returns/from-invoice/${invoiceId}/`;
}
</script>

{% endblock %}
