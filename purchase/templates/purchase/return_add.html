{% extends "layout/base.html" %}
{% load i18n %}
{% block content %}

<style>
.btn-main {
    background:#6c757d !important;
    color:white !important;
    border-radius:6px;
    font-size:18px;
    padding:10px 25px;
}
.btn-main:hover {
    background:#5c636a !important;
}
</style>

<div class="container mt-4">

    <h2 class="fw-bold text-center mb-4">
        {% trans "Create Debit Note (Purchase Return)" %}
    </h2>

    <!-- ================= Supplier ================= -->
    <label class="fw-bold">{% trans "Select Supplier:" %}</label>
    <select id="supplierSelect" class="form-select mb-3">
        <option value="">{% trans "-- Select Supplier --" %}</option>
        {% for s in suppliers %}
            <option value="{{ s.id }}">{{ s.commercial_name }}</option>
        {% endfor %}
    </select>

    <!-- ================= Invoice ================= -->
    <label class="fw-bold">{% trans "Select Purchase Invoice:" %}</label>
    <select id="invoiceSelect" class="form-select mb-4" disabled>
        <option value="">{% trans "-- Select supplier first --" %}</option>
    </select>

    <!-- ================= Continue ================= -->
    <div class="text-center mt-4">
        <a id="continueBtn"
           class="btn-main btn-lg disabled"
           role="button">
            {% trans "Continue Creating Return" %}
        </a>
    </div>

</div>

<script>
const LOADING_TEXT = "{% trans 'Loading...' %}";
const SELECT_SUPPLIER_FIRST_TEXT = "{% trans '-- Select supplier first --' %}";
const SELECT_INVOICE_TEXT = "{% trans '-- Select Invoice --' %}";
const NO_INVOICES_FOUND_TEXT = "{% trans 'No invoices found for this supplier' %}";
const ERROR_LOADING_INVOICES_TEXT = "{% trans 'Error loading invoices' %}";
const INVOICE_NO_TEXT = "{% trans 'Invoice No' %}";
const SAR_TEXT = "{% trans 'SAR' %}";

// =================================================
// Select Supplier → Load Purchase Invoices
// =================================================
document.getElementById("supplierSelect").addEventListener("change", function () {

    const supplierId    = this.value;
    const invoiceSelect = document.getElementById("invoiceSelect");

    invoiceSelect.disabled = true;
    invoiceSelect.innerHTML = `<option>${LOADING_TEXT}</option>`;

    if (!supplierId) {
        invoiceSelect.innerHTML = `<option value="">${SELECT_SUPPLIER_FIRST_TEXT}</option>`;
        return;
    }

    fetch("{% url 'purchase:api_supplier_invoices' %}?supplier_id=" + supplierId)
        .then(res => {
            if (!res.ok) throw new Error("HTTP Error");
            return res.json();
        })
        .then(data => {

            invoiceSelect.innerHTML = `<option value="">${SELECT_INVOICE_TEXT}</option>`;
            invoiceSelect.disabled = false;

            if (!data.invoices || data.invoices.length === 0) {
                invoiceSelect.innerHTML +=
                    `<option value="">${NO_INVOICES_FOUND_TEXT}</option>`;
                return;
            }

            data.invoices.forEach(inv => {
                invoiceSelect.innerHTML += `
                    <option value="${inv.id}">
                        ${INVOICE_NO_TEXT} ${inv.invoice_no}
                        | ${inv.total} ${SAR_TEXT}
                    </option>
                `;
            });
        })
        .catch(() => {
            invoiceSelect.innerHTML =
                `<option value="">${ERROR_LOADING_INVOICES_TEXT}</option>`;
        });
});


// =================================================
// Select Invoice → Enable Continue Button
// =================================================
document.getElementById("invoiceSelect").addEventListener("change", function () {

    const invoiceId = this.value;
    const btn       = document.getElementById("continueBtn");

    if (!invoiceId) {
        btn.classList.add("disabled");
        btn.removeAttribute("href");
        return;
    }

    btn.classList.remove("disabled");
    btn.href = `/purchase/returns/from-invoice/${invoiceId}/`;
});
</script>

{% endblock %}
