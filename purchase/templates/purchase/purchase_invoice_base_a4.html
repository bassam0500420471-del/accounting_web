{% load i18n %}
<!DOCTYPE html>
<html lang="{% get_current_language as LANGUAGE_CODE %}{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">

<head>
    <meta charset="UTF-8">
    <title>{% trans "Purchase Invoice" %}</title>

    <style>

        body {
            font-family: "Tahoma";
            background: #fff;
            margin: 0;
            padding: 0;
            direction: {% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %};
        }

        .invoice-container {
            width: 794px;
            min-height: 1123px;
            margin: auto;
            background: #fff;
            padding: 30px 40px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .text-center {
            text-align: center;
        }

        .fw-bold {
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th, table td {
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
            font-size: 14px;
        }

        table th {
            background: #f5f5f5;
        }

        hr {
            border: none;
            border-top: 1px solid #aaa;
            margin: 20px 0;
        }

        @media print {
            body {
                background: #fff;
            }

            .invoice-container {
                margin: 0;
                width: 100%;
                box-shadow: none;
            }

            @page {
                size: A4;
                margin: 0;
            }
        }

    </style>
</head>

<body>

    {% block content %}
    <!-- purchase_view or purchase_print content goes here -->
    {% endblock %}

</body>

</html>
