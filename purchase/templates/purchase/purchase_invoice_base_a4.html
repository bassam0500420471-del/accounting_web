{% load i18n %}

<!DOCTYPE html>

<html
    lang="{% get_current_language as LANGUAGE_CODE %}{{ LANGUAGE_CODE }}"
    dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% trans "Purchase Invoice" %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: Tahoma, "Segoe UI", Arial, sans-serif;
            background: #fff;
            direction:
                {% if LANGUAGE_CODE == 'ar' %}
                    rtl
                {% else %}
                    ltr
                {% endif %};
        }


        button,
        a {
            font-family: inherit;
        }


        /* =====================================================
           الطباعة العامة
           ===================================================== */

        @media print {

            @page {
                size: A4;
                margin: 10mm;
            }


            html,
            body {
                width: 100% !important;
                min-height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }


            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

        }

    </style>

</head>


<body>

    {% block content %}

    {% endblock %}


    <script>

        function printInvoice() {

            window.focus();

            setTimeout(function () {

                window.print();

            }, 200);

        }

    </script>

</body>

</html>
