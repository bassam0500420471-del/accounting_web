<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>فاتورة مشتريات</title>

    <style>

        body {
            font-family: "Tahoma";
            background: #fff;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .invoice-container {
            width: 794px;              /* عرض A4 */
            min-height: 1123px;        /* ارتفاع A4 */
            margin: auto;
            background: #fff;
            padding: 30px 40px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .text-center {
            text-align: center;
        }

        .fw-bold {
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th, table td {
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
            font-size: 14px;
        }

        table th {
            background: #f5f5f5;
        }

        hr {
            border: none;
            border-top: 1px solid #aaa;
            margin: 20px 0;
        }

        /* الطباعة */
        @media print {
            body {
                background: #fff;
            }

            .invoice-container {
                margin: 0;
                width: 100%;
                box-shadow: none;
            }

            @page {
                size: A4;
                margin: 0;
            }
        }

    </style>
</head>

<body>

    {% block content %}
    <!-- هنا يوضع محتوى purchase_view أو purchase_print -->
    {% endblock %}

</body>

</html>
