{% extends "layout/base.html" %}

{% block content %}

<div class="container mt-4">

    <!-- =========================================================
         رأس الصفحة
    ========================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h4 class="page-title">
                تعديل مركز التكلفة
            </h4>

            <div class="text-muted small">
                تعديل بيانات مركز التكلفة
            </div>

        </div>

        <a
            href="{% url 'cost_center_detail' cost_center_id=cost_center.id %}"
            class="btn btn-secondary"
        >
            <i class="bi bi-arrow-right"></i>
            العودة
        </a>

    </div>


    <!-- =========================================================
         نموذج التعديل
    ========================================================== -->

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}


            <!-- =================================================
                 اسم مركز التكلفة
            ================================================== -->

            <div class="form-group">

                <label>
                    اسم مركز التكلفة
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ cost_center.name }}"
                    class="form-control"
                    required
                >

            </div>


            <!-- =================================================
                 الكود
            ================================================== -->

            <div class="form-group">

                <label>
                    كود مركز التكلفة
                </label>

                <input
                    type="text"
                    name="code"
                    value="{{ cost_center.code|default:'' }}"
                    class="form-control"
                >

            </div>


            <!-- =================================================
                 النوع
            ================================================== -->

            <div class="form-group">

                <label>
                    نوع مركز التكلفة
                    <span class="required">*</span>
                </label>

                <select
                    name="type"
                    id="type"
                    class="form-control"
                    required
                >

                    <option value="">
                        اختر النوع
                    </option>

                    {% for value, label in type_choices %}

                        <option
                            value="{{ value }}"
                            {% if cost_center.type == value %}
                                selected
                            {% endif %}
                        >
                            {{ label }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================================
                 المركز الأب
            ================================================== -->

            <div class="form-group">

                <label>
                    المركز الأب
                </label>

                <select
                    name="parent"
                    class="form-control"
                >

                    <option value="">
                        بدون مركز أب
                    </option>

                    {% for parent in parents %}

                        <option
                            value="{{ parent.id }}"
                            {% if cost_center.parent_id == parent.id %}
                                selected
                            {% endif %}
                        >
                            {{ parent.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================================
                 الفرع
            ================================================== -->

            <div class="form-group">

                <label>
                    الفرع
                </label>

                <select
                    name="branch"
                    class="form-control"
                >

                    <option value="">
                        بدون فرع
                    </option>

                    {% for branch in branches %}

                        <option
                            value="{{ branch.id }}"
                            {% if cost_center.branch_id == branch.id %}
                                selected
                            {% endif %}
                        >
                            {{ branch.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================================
                 المورد
            ================================================== -->

            <div
                class="form-group"
                id="supplier-group"
            >

                <label>
                    المورد
                </label>

                <select
                    name="supplier"
                    class="form-control"
                >

                    <option value="">
                        اختر المورد
                    </option>

                    {% for supplier in suppliers %}

                        <option
                            value="{{ supplier.id }}"
                            {% if cost_center.object_id == supplier.id and cost_center.content_type.model == "supplier" %}
                                selected
                            {% endif %}
                        >
                            {{ supplier.commercial_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================================
                 العميل
            ================================================== -->

            <div
                class="form-group"
                id="customer-group"
            >

                <label>
                    العميل
                </label>

                <select
                    name="customer"
                    class="form-control"
                >

                    <option value="">
                        اختر العميل
                    </option>

                    {% for customer in customers %}

                        <option
                            value="{{ customer.id }}"
                            {% if cost_center.object_id == customer.id and cost_center.content_type.model == "customer" %}
                                selected
                            {% endif %}
                        >
                            {{ customer.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================================
                 الأزرار
            ================================================== -->

            <div class="form-actions">

                <a
                    href="{% url 'cost_center_detail' cost_center_id=cost_center.id %}"
                    class="btn-secondary-custom"
                >
                    إلغاء
                </a>

                <button
                    type="submit"
                    class="btn-primary-custom"
                >
                    <i class="bi bi-check-lg"></i>
                    حفظ التعديل
                </button>

            </div>

        </form>

    </div>

</div>


<style>

/* =========================================================
   عنوان الصفحة
========================================================= */

.page-title {

    margin: 0;

    color: #3f3f3f;

    font-weight: 800;

}


/* =========================================================
   بطاقة النموذج
========================================================= */

.form-card {

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border:
        1px solid #d5d5d5;

    border-radius: 16px;

    padding: 25px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.10),
        inset 0 1px 1px rgba(255,255,255,.9);

}


/* =========================================================
   المجموعة
========================================================= */

.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    color: #555;

    font-size: 13px;

    font-weight: 800;

}


.required {

    color: #888;

}


/* =========================================================
   الحقول
========================================================= */

.form-control {

    width: 100%;

    min-height: 43px;

    padding:
        8px
        12px;

    border:
        1px solid #d0d0d0;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    color: #444;

    font-family: Tahoma, sans-serif;

    font-size: 13px;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,.05);

}


.form-control:focus {

    outline: none;

    border-color: #999;

    box-shadow:
        0 0 0 3px rgba(0,0,0,.06);

}


/* =========================================================
   الأزرار
========================================================= */

.form-actions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 25px;

    padding-top: 20px;

    border-top:
        1px solid #d8d8d8;

}


.btn-primary-custom,
.btn-secondary-custom {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    min-height: 40px;

    padding:
        8px
        18px;

    border-radius: 9px;

    text-decoration: none;

    font-family: Tahoma, sans-serif;

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;

}


/* =========================================================
   حفظ
========================================================= */

.btn-primary-custom {

    color: #444;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #cccccc
        );

    border:
        1px solid #c0c0c0;

    box-shadow:
        0 4px 9px rgba(0,0,0,.10),
        inset 0 1px 1px rgba(255,255,255,.9);

}


.btn-primary-custom:hover {

    color: #222;

    transform: translateY(-2px);

    box-shadow:
        0 7px 13px rgba(0,0,0,.15);

}


/* =========================================================
   إلغاء
========================================================= */

.btn-secondary-custom {

    color: #555;

    background:
        linear-gradient(
            145deg,
            #f5f5f5,
            #dcdcdc
        );

    border:
        1px solid #cecece;

}


.btn-secondary-custom:hover {

    color: #222;

    transform: translateY(-2px);

}


/* =========================================================
   الجوال
========================================================= */

@media (max-width: 768px) {

    .form-card {

        padding: 18px;

    }


    .form-actions {

        flex-direction: column;

    }


    .btn-primary-custom,
    .btn-secondary-custom {

        width: 100%;

    }

}

</style>


<script>

/* =========================================================
   إظهار المورد أو العميل حسب النوع
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const typeSelect =
            document.getElementById("type");

        const supplierGroup =
            document.getElementById("supplier-group");

        const customerGroup =
            document.getElementById("customer-group");


        function updateFields() {

            const type =
                typeSelect.value;


            if (supplierGroup) {

                supplierGroup.style.display =
                    type === "SUPPLIER"
                        ? "block"
                        : "none";

            }


            if (customerGroup) {

                customerGroup.style.display =
                    type === "CUSTOMER"
                        ? "block"
                        : "none";

            }

        }


        if (typeSelect) {

            typeSelect.addEventListener(
                "change",
                updateFields
            );

            updateFields();

        }

    }
);

</script>

{% endblock %}
