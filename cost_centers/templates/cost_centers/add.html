{% extends "layout/base.html" %}
{% block content %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
/* ===============================
   Labels + Help Icons
================================ */
.field-label {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    direction: rtl;
    text-align: right;
}

.field-label .help-icon {
    order: -1;          /* الأيقونة يمين النص */
    margin-left: 6px;
}

.help-icon {
    font-size: 14px;
    color: #0d6efd;
    cursor: pointer;
}

/* ===============================
   توحيد حجم كل الحقول
================================ */
.form-control,
.form-select {
    height: 44px;
    padding-top: 10px;
    padding-bottom: 10px;
    font-size: 15px;
}

/* Select2 */
.select2-container .select2-selection--single {
    height: 44px !important;
    display: flex !important;
    align-items: center !important;
    border-radius: 0.375rem;
}

.select2-container--default
.select2-selection--single
.select2-selection__rendered {
    line-height: 44px !important;
    padding-right: 12px !important;
    padding-left: 12px !important;
    font-size: 15px;
}

.select2-container--default
.select2-selection--single
.select2-selection__arrow {
    height: 44px !important;
}
</style>
{% endblock %}

<div class="container mt-4" style="max-width:650px">
    <h4 class="mb-4 text-center">إضافة مركز تكلفة</h4>

    <form method="post">
        {% csrf_token %}

        <!-- ================= اسم مركز التكلفة ================= -->
        <div class="mb-3">
            <label class="field-label">
                اسم مركز التكلفة
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="اسم الجهة أو النشاط الذي سيتم تحميل التكاليف عليه"></i>
            </label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <!-- ================= مستوى مركز التكلفة ================= -->
        <div class="mb-3">
            <label class="field-label">
                مستوى مركز التكلفة (اختياري)
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="بدون اختيار = مركز رئيسي
مع اختيار = مركز فرعي تابع لمركز آخر"></i>
            </label>

            <select name="parent" id="parent-select" class="form-select select2">
                <option value="">— مركز رئيسي —</option>
                <option value="__add__">➕ إضافة مركز جديد</option>
                {% for p in parents %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>

            <small class="text-muted">
                يستخدم هذا الحقل لبناء شجرة مراكز التكلفة
            </small>
        </div>

        <!-- ================= النوع ================= -->
        <div class="mb-3">
            <label class="field-label">
                النوع
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="يحدد طبيعة مركز التكلفة داخل النظام"></i>
            </label>
            <select name="type" id="type-select" class="form-select" required>
                <option value="">— اختر النوع —</option>
                {% for k, v in type_choices %}
                    <option value="{{ k }}">{{ v }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- ================= المورد ================= -->
        <div class="mb-3" id="supplier-box" style="display:none;">
            <label class="field-label">
                المورد
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="يظهر عند اختيار النوع (مورد) فقط"></i>
            </label>
            <select name="supplier" class="form-select select2">
                <option value="">— اختر المورد —</option>
                {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.commercial_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- ================= العميل ================= -->
        <div class="mb-3" id="customer-box" style="display:none;">
            <label class="field-label">
                العميل
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="يظهر عند اختيار النوع (عميل) فقط"></i>
            </label>
            <select name="customer" class="form-select select2">
                <option value="">— اختر العميل —</option>
                {% for c in customers %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- ================= الفرع ================= -->
        <div class="mb-3">
            <label class="field-label">
                الفرع
                <i class="bi bi-info-circle help-icon"
                   data-bs-toggle="tooltip"
                   title="ربط مركز التكلفة بفرع محدد إن وجد"></i>
            </label>
            <select name="branch" id="branch-select" class="form-select select2">
                <option value="">— اختر الفرع —</option>
                <option value="__add__">➕ إضافة فرع جديد</option>
                {% for b in branches %}
                    <option value="{{ b.id }}">{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="text-end">
            <button class="btn btn-primary">حفظ</button>
            <a href="{% url 'cost_centers_list' %}" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(function () {

    /* Select2 عام */
    $('.select2').select2({
        width: '100%',
        dir: 'rtl',
        placeholder: 'اكتب للبحث...'
    });

    /* زر إضافة مركز من القائمة */
    $('#parent-select').on('select2:select', function (e) {
        if (e.params.data.id === '__add__') {
            $(this).val(null).trigger('change');
            $('#addParentModal').modal('show');
        }
    });

    /* إظهار مورد / عميل حسب النوع */
    const typeSelect = $('#type-select');
    const supplierBox = $('#supplier-box');
    const customerBox = $('#customer-box');

    function toggleRelated() {
        supplierBox.hide();
        customerBox.hide();
        if (typeSelect.val() === 'SUPPLIER') supplierBox.show();
        if (typeSelect.val() === 'CUSTOMER') customerBox.show();
    }

    typeSelect.on('change', toggleRelated);
    toggleRelated();

    /* Tooltips */
    const tooltipTriggerList = [].slice.call(
        document.querySelectorAll('[data-bs-toggle="tooltip"]')
    );
    tooltipTriggerList.map(el => new bootstrap.Tooltip(el));

});
</script>
{% endblock %}

{% endblock %}
