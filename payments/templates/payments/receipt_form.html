{% extends "layout/base.html" %}
{% load static %}
{% block title %}سند قبض{% endblock %}

{% block content %}

<!-- Select2 (نفس سند الصرف) -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
    .select2-container .select2-selection--single {
        height: 38px;
        padding: 5px 10px;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
    }
    .select2-selection__rendered {
        line-height: normal !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
    .select2-selection__arrow {
        height: 36px;
    }
</style>

<div class="container mt-4" style="max-width: 900px;">
    <h3 class="text-center mb-4">سند قبض</h3>

    <form method="post">
        {% csrf_token %}

        <!-- نوع الجهة (نفس الصرف) -->
        <label class="fw-bold mb-1">نوع الجهة</label>
        <select id="partyType" class="form-select mb-3" required>
            <option value="">-- اختر --</option>
            <option value="customer">عميل</option>
            <option value="supplier">مورد</option>
        </select>

        <!-- الجهة -->
        <label class="fw-bold mb-1">الجهة</label>
        <select id="partySelect" class="form-select mb-3" required>
            <option value="">-- اختر أولاً نوع الجهة --</option>
        </select>

        <!-- حقول مخفية تخدم receipt_create -->
        <input type="hidden" name="party_type" id="partyTypeInput">
        <input type="hidden" name="party_id" id="partyIdInput">

        <!-- الحساب -->
        <label class="fw-bold mb-1">الحساب (صندوق / بنك)</label>
        <select name="cash_account" class="form-select mb-3" required>
            <option value="">-- اختر الحساب --</option>
            {% for a in cash_accounts %}
                <option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>
            {% endfor %}
        </select>

        <!-- المبلغ -->
        <label class="fw-bold mb-1">المبلغ</label>
        <input type="number" step="0.01" name="amount" class="form-control mb-3" required>

        <!-- البيان -->
        <label class="fw-bold mb-1">البيان</label>
        <input type="text" name="description" class="form-control mb-4">

        <div class="text-end">
            <button type="submit" class="btn btn-success px-4">
                حفظ وترحيل
            </button>
        </div>
    </form>
</div>

<script>
    function initSelect2(){
        $("#partySelect").select2({
            width: "100%",
            placeholder: "-- اختر الجهة --",
            allowClear: true
        });
    }

    function loadParties(partyType){
        $("#partySelect")
            .empty()
            .append('<option value="">جار التحميل...</option>');

        $.get("{% url 'payments:load_parties' %}", {party_type: partyType}, function(data){
            $("#partySelect")
                .empty()
                .append('<option value="">-- اختر الجهة --</option>');

            if (data && data.length){
                data.forEach(function(item){
                    $("#partySelect").append(
                        `<option value="${item.id}">${item.text}</option>`
                    );
                });
            }

            initSelect2();
        });
    }

    $(document).ready(function(){
        initSelect2();

        $("#partyType").on("change", function(){
            const t = $(this).val();

            $("#partyTypeInput").val("");
            $("#partyIdInput").val("");

            if (!t){
                $("#partySelect")
                    .html('<option value="">-- اختر أولاً نوع الجهة --</option>');
                initSelect2();
                return;
            }

            loadParties(t);
        });

        $("#partySelect").on("change", function(){
            $("#partyTypeInput").val($("#partyType").val());
            $("#partyIdInput").val($(this).val());
        });
    });
</script>

{% endblock %}
