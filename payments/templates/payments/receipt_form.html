{% extends "layout/base.html" %}
{% load static i18n %}

{% block title %}{% trans "Receipt Voucher" %}{% endblock %}

{% block content %}

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


<style>

/* =========================================================
   الخلفية العامة
========================================================= */

body {

    background:
        radial-gradient(
            circle at top left,
            #ffffff 0%,
            #eeeeee 35%,
            #d4d4d4 100%
        );

}


/* =========================================================
   الصفحة
========================================================= */

.receipt-page {

    min-height: calc(100vh - 40px);

    padding: 30px;

    background:
        linear-gradient(
            135deg,
            #f8f8f8 0%,
            #e9e9e9 45%,
            #cecece 100%
        );

}


/* =========================================================
   الحاوية
========================================================= */

.receipt-wrapper {

    max-width: 1200px;

    margin: auto;

}


/* =========================================================
   رأس الصفحة
========================================================= */

.receipt-header {

    display: flex;

    align-items: center;

    gap: 16px;

    margin-bottom: 28px;

    padding: 22px 26px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dedede
        );

    border: 1px solid rgba(255,255,255,.9);

    box-shadow:
        0 16px 35px rgba(0,0,0,.16),
        0 5px 12px rgba(0,0,0,.07),
        inset 0 1px 1px rgba(255,255,255,.95);

}


/* =========================================================
   أيقونة الرأس
========================================================= */

.receipt-header-icon {

    width: 58px;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 16px;

    color: #fff;

    font-size: 24px;

    background:
        linear-gradient(
            145deg,
            #777777,
            #292929
        );

    box-shadow:
        0 8px 18px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.25);

}


/* =========================================================
   عنوان الصفحة
========================================================= */

.receipt-header h3 {

    margin: 0;

    color: #333;

    font-size: 27px;

    font-weight: 800;

}


/* =========================================================
   الكرت الرئيسي
========================================================= */

.receipt-card {

    position: relative;

    overflow: hidden;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #eeeeee 55%,
            #d8d8d8 100%
        );

    border: 1px solid rgba(255,255,255,.95);

    box-shadow:
        0 20px 42px rgba(0,0,0,.18),
        0 6px 14px rgba(0,0,0,.08),
        inset 0 1px 1px rgba(255,255,255,.95);

}


/* =========================================================
   الخط العلوي
========================================================= */

.receipt-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 15%;

    right: 15%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    z-index: 5;

}


/* =========================================================
   رأس الكرت
========================================================= */

.receipt-card-header {

    padding: 18px 24px;

    color: #fff;

    font-size: 18px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #777777,
            #3b3b3b
        );

    box-shadow:
        inset 0 -1px 0 rgba(0,0,0,.20),
        inset 0 1px 1px rgba(255,255,255,.25);

}


/* =========================================================
   جسم الكرت
========================================================= */

.receipt-card-body {

    padding: 24px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f0f0f0
        );

}


/* =========================================================
   جدول الإدخال
========================================================= */

.receipt-form-table {

    width: 100%;

    margin: 0;

    border-collapse: separate;

    border-spacing: 0 12px;

}


/* =========================================================
   خلايا الجدول
========================================================= */

.receipt-form-table th,
.receipt-form-table td {

    padding: 10px 18px;

    vertical-align: middle;

    border: none;

}


/* =========================================================
   عنوان الحقل
========================================================= */

.receipt-form-table th {

    width: 230px;

    color: #555;

    font-size: 14px;

    font-weight: 800;

    text-align: right;

}


/* =========================================================
   الحقول
========================================================= */

.receipt-input,
.receipt-form-table select,
.receipt-form-table input {

    width: 100%;

    min-height: 44px;

    padding: 9px 13px;

    color: #444;

    font-size: 14px;

    font-weight: 600;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border: 1px solid #cfcfcf;

    border-radius: 11px;

    outline: none;

    box-shadow:
        0 4px 9px rgba(0,0,0,.08),
        inset 0 1px 1px rgba(255,255,255,.95);

    transition: .2s ease;

}


.receipt-input:focus,
.receipt-form-table select:focus,
.receipt-form-table input:focus {

    border-color: #888;

    box-shadow:
        0 5px 12px rgba(0,0,0,.12),
        inset 0 1px 1px rgba(255,255,255,.95);

}


/* =========================================================
   Select2
========================================================= */

.select2-container {

    width: 100% !important;

}


.select2-container .select2-selection--single {

    height: 44px;

    padding: 6px 13px;

    border: 1px solid #cfcfcf;

    border-radius: 11px;

    display: flex;

    align-items: center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    box-shadow:
        0 4px 9px rgba(0,0,0,.08),
        inset 0 1px 1px rgba(255,255,255,.95);

}


.select2-selection__rendered {

    line-height: normal !important;

    padding-left: 0 !important;

    padding-right: 0 !important;

    color: #444 !important;

    font-weight: 600;

}


.select2-selection__arrow {

    height: 42px !important;

}


/* =========================================================
   زر الحفظ
========================================================= */

.receipt-save-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    min-height: 44px;

    padding: 10px 26px;

    color: #fff !important;

    border: 1px solid rgba(255,255,255,.25);

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #777777,
            #3c3c3c
        );

    font-size: 14px;

    font-weight: 800;

    box-shadow:
        0 6px 12px rgba(0,0,0,.18),
        inset 0 1px 1px rgba(255,255,255,.25);

    transition: .2s ease;

}


.receipt-save-btn:hover {

    color: #fff !important;

    transform: translateY(-2px);

    background:
        linear-gradient(
            145deg,
            #858585,
            #333333
        );

    box-shadow:
        0 9px 17px rgba(0,0,0,.22),
        inset 0 1px 1px rgba(255,255,255,.3);

}


/* =========================================================
   منطقة الأزرار
========================================================= */

.receipt-actions {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 20px;

    padding: 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #eeeeee,
            #d2d2d2
        );

    border: 1px solid #d0d0d0;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.9),
        0 8px 18px rgba(0,0,0,.10);

}


/* =========================================================
   الشاشات المتوسطة
========================================================= */

@media (max-width: 768px) {

    .receipt-page {

        padding: 15px;

    }


    .receipt-header {

        padding: 18px;

    }


    .receipt-header h3 {

        font-size: 21px;

    }


    .receipt-header-icon {

        width: 50px;

        height: 50px;

        font-size: 20px;

    }


    .receipt-card-body {

        padding: 14px;

    }


    .receipt-form-table th {

        width: 35%;

        font-size: 12px;

        padding: 10px 8px;

    }


    .receipt-form-table td {

        padding: 8px;

    }


    .receipt-actions {

        padding: 14px;

    }

}

</style>


<div class="receipt-page">

    <div class="receipt-wrapper">


        <!-- =================================================
             رأس الصفحة
        ================================================= -->

        <div class="receipt-header">

            <div class="receipt-header-icon">

                💰

            </div>

            <div>

                <h3>

                    {% trans "Receipt Voucher" %}

                </h3>

            </div>

        </div>


        <!-- =================================================
             الكرت الرئيسي
        ================================================= -->

        <div class="receipt-card">


            <div class="receipt-card-header">

                {% trans "Receipt Voucher" %}

            </div>


            <div class="receipt-card-body">


                <form method="post">

                    {% csrf_token %}


                    <input
                        type="hidden"
                        name="invoice_id"
                        value="{{ invoice_id }}"
                    >


                    <table class="receipt-form-table">


                        <!-- نوع الجهة -->

                        <tr>

                            <th>

                                <label for="partyType">

                                    {% trans "Party Type" %}

                                </label>

                            </th>

                            <td>

                                <select
                                    id="partyType"
                                    class="form-select"
                                    required
                                >

                                    <option value="">

                                        {% trans "-- Select --" %}

                                    </option>

                                    <option value="customer">

                                        {% trans "Customer" %}

                                    </option>

                                    <option value="supplier">

                                        {% trans "Supplier" %}

                                    </option>

                                </select>

                            </td>

                        </tr>


                        <!-- الجهة -->

                        <tr>

                            <th>

                                <label for="partySelect">

                                    {% trans "Party" %}

                                </label>

                            </th>

                            <td>

                                <select
                                    id="partySelect"
                                    class="form-select"
                                    required
                                >

                                    <option value="">

                                        {% trans "-- Select Party Type First --" %}

                                    </option>

                                </select>

                            </td>

                        </tr>


                        <!-- hidden fields -->

                        <input
                            type="hidden"
                            name="party_type"
                            id="partyTypeInput"
                        >

                        <input
                            type="hidden"
                            name="party_id"
                            id="partyIdInput"
                        >

                        <input
                            type="hidden"
                            name="customer"
                            id="customerInput"
                        >

                        <input
                            type="hidden"
                            name="supplier"
                            id="supplierInput"
                        >


                        <!-- الحساب -->

                        <tr>

                            <th>

                                <label for="cashAccount">

                                    {% trans "Cash / Bank Account" %}

                                </label>

                            </th>

                            <td>

                                <select
                                    name="cash_account"
                                    id="cashAccount"
                                    class="form-select"
                                    required
                                >

                                    <option value="">

                                        {% trans "-- Select Account --" %}

                                    </option>

                                    {% for a in cash_accounts %}

                                        <option value="{{ a.id }}">

                                            {{ a.code }} - {{ a.name }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </td>

                        </tr>


                        <!-- المبلغ -->

                        <tr>

                            <th>

                                <label for="amount">

                                    {% trans "Amount" %}

                                </label>

                            </th>

                            <td>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="amount"
                                    id="amount"
                                    class="receipt-input"
                                    required
                                >

                            </td>

                        </tr>


                        <!-- البيان -->

                        <tr>

                            <th>

                                <label for="description">

                                    {% trans "Description" %}

                                </label>

                            </th>

                            <td>

                                <input
                                    type="text"
                                    name="description"
                                    id="description"
                                    class="receipt-input"
                                >

                            </td>

                        </tr>


                    </table>


                    <!-- =================================================
                         الأزرار
                    ================================================= -->

                    <div class="receipt-actions">

                        <button
                            type="submit"
                            class="receipt-save-btn"
                        >

                            💾 {% trans "Save & Post" %}

                        </button>

                    </div>


                </form>


            </div>

        </div>


    </div>

</div>


<script>

function initSelect2() {

    $("#partySelect").select2({

        width: "100%",

        placeholder:
            "{% trans '-- Select Party --' %}",

        allowClear: true

    });

}


function loadParties(partyType) {

    $("#partySelect")
        .empty()
        .append(
            '<option value="">{% trans "Loading..." %}</option>'
        );


    $.get(

        "{% url 'payments:load_parties' %}",

        {
            party_type: partyType
        },

        function(data) {

            $("#partySelect")
                .empty()
                .append(
                    '<option value="">{% trans "-- Select Party --" %}</option>'
                );


            if (data && data.length) {

                data.forEach(function(item) {

                    $("#partySelect").append(

                        `<option value="${item.id}">${item.text}</option>`

                    );

                });

            }


            initSelect2();

        }

    );

}


$(document).ready(function() {


    initSelect2();


    $("#partyType").on("change", function() {


        const t = $(this).val();


        $("#partyTypeInput").val(t);

        $("#partyIdInput").val("");

        $("#supplierInput").val("");

        $("#customerInput").val("");


        if (!t) {


            $("#partySelect")

                .html(
                    '<option value="">{% trans "-- Select Party Type First --" %}</option>'
                );


            initSelect2();


            return;

        }


        loadParties(t);


    });


    $("#partySelect").on("change", function() {


        const partyId = $(this).val();

        const partyType = $("#partyType").val();


        $("#partyTypeInput").val(partyType);

        $("#partyIdInput").val(partyId);

        $("#supplierInput").val("");

        $("#customerInput").val("");


        if (partyType === "supplier") {

            $("#supplierInput").val(partyId);

        }

        else if (partyType === "customer") {

            $("#customerInput").val(partyId);

        }


    });


});

</script>


{% endblock %}
