{% extends "layout/base.html" %}
{% load static i18n %}

{% block title %}{% trans "Payment Voucher" %}{% endblock %}

{% block content %}

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
    .select2-container .select2-selection--single {
        height: 38px;
        padding: 5px 10px;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
    }

    .select2-selection__rendered {
        line-height: normal !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .select2-selection__arrow {
        height: 36px;
    }
</style>

<div class="container mt-4" style="max-width: 900px;">

    <h3 class="text-center mb-4">
        {% trans "Payment Voucher" %}
    </h3>

    <form method="post">
        {% csrf_token %}

        <!-- نوع الجهة -->
        <label class="fw-bold mb-1">{% trans "Party Type" %}</label>
        <select id="partyType" class="form-select mb-3" required>
            <option value="">{% trans "-- Select --" %}</option>
            <option value="customer">{% trans "Customer" %}</option>
            <option value="supplier">{% trans "Supplier" %}</option>
        </select>

        <!-- الجهة -->
        <label class="fw-bold mb-1">{% trans "Party" %}</label>
        <select id="partySelect" class="form-select mb-3" required>
            <option value="">{% trans "-- Select Party Type First --" %}</option>
        </select>

        <!-- hidden fields -->
        <input type="hidden" name="party_type" id="partyTypeInput">
        <input type="hidden" name="supplier" id="supplierInput">
        <input type="hidden" name="customer" id="customerInput">

        <!-- الحساب -->
        <label class="fw-bold mb-1">{% trans "Cash / Bank Account" %}</label>
        <select name="cash_account" class="form-select mb-3" required>
            <option value="">{% trans "-- Select Account --" %}</option>
            {% for a in cash_accounts %}
                <option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>
            {% endfor %}
        </select>

        <!-- المبلغ -->
        <label class="fw-bold mb-1">{% trans "Amount" %}</label>
        <input type="number" step="0.01" name="amount" class="form-control mb-3" required>

        <!-- البيان -->
        <label class="fw-bold mb-1">{% trans "Description" %}</label>
        <input type="text" name="description" class="form-control mb-4">

        <div class="text-end">
            <button type="submit" class="btn btn-secondary px-4">
                {% trans "Save & Post" %}
            </button>
        </div>

    </form>
</div>

<script>
    function initSelect2(){
        $("#partySelect").select2({
            width: "100%",
            placeholder: "{% trans '-- Select Party --' %}",
            allowClear: true
        });
    }

    function loadParties(partyType){
        $("#partySelect")
            .empty()
            .append('<option value="">{% trans "Loading..." %}</option>');

        $.get("{% url 'payments:load_parties' %}", {party_type: partyType}, function(data){
            $("#partySelect").empty().append('<option value="">{% trans "-- Select Party --" %}</option>');

            if (data && data.length){
                data.forEach(function(item){
                    $("#partySelect").append(
                        `<option value="${item.id}">${item.text}</option>`
                    );
                });
            }

            initSelect2();
        });
    }

    $(document).ready(function(){

        initSelect2();

        $("#partyType").on("change", function(){

            const t = $(this).val();

            $("#partyTypeInput").val(t);

            $("#supplierInput").val("");
            $("#customerInput").val("");

            if (!t){

                $("#partySelect")
                    .html('<option value="">{% trans "-- Select Party Type First --" %}</option>');

                initSelect2();

                return;
            }

            loadParties(t);

        });


        $("#partySelect").on("change", function(){

            const partyId = $(this).val();
            const partyType = $("#partyType").val();

            $("#partyTypeInput").val(partyType);

            $("#supplierInput").val("");
            $("#customerInput").val("");

            if (partyType === "supplier"){

                $("#supplierInput").val(partyId);

            } else if (partyType === "customer"){

                $("#customerInput").val(partyId);

            }

        });

    });

</script>

{% endblock %}
