{% extends "layout/base.html" %}
{% load i18n %}

{% block title %}إعدادات ربط هيئة الزكاة{% endblock %}

{% block content %}
<style>
    .card-header-custom { background-color: #2D3033; color: #fff; padding: 15px 20px; border-radius: 8px 8px 0 0; }
    .btn-custom-save { background-color: #2D3033; color: white; border: none; }
    .form-label { font-weight: bold; color: #333; }
</style>

<div class="card shadow-sm border-0">
    <div class="card-header-custom">
        <h4 class="mb-0">إعدادات ربط هيئة الزكاة والفاتورة الإلكترونية</h4>
    </div>

    <div class="card-body p-4">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">اسم الشركة</label>
                    <input type="text" class="form-control" value="{{ company.name }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">بيئة الربط</label>
                    <select name="environment" class="form-select">
                        <option value="sandbox" {% if zatca_settings.environment == 'sandbox' %}selected{% endif %}>البيئة التجريبية (Sandbox)</option>
                        <option value="simulation" {% if zatca_settings.environment == 'simulation' %}selected{% endif %}>بيئة المحاكاة (Simulation)</option>
                        <option value="production" {% if zatca_settings.environment == 'production' %}selected{% endif %}>بيئة الإنتاج (Production)</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">رمز التحقق (OTP) من بوابة فاتورة</label>
                    <input type="text" name="otp_code" class="form-control" placeholder="أدخل رمز الـ OTP هنا لبدء التسجيل">
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_active" id="activeCheck" {% if zatca_settings.is_enabled %}checked{% endif %}>
                        <label class="form-check-label" for="activeCheck">تفعيل الربط الإلكتروني</label>
                    </div>
                </div>
            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-md-6">
<label class="form-label">الرقم الضريبي</label>
<input type="text" class="form-control" value="{{ company.info.tax_number|default:'غير متوفر' }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">معرّف الطلب (Compliance Request ID)</label>
                    <input type="text" class="form-control" value="{{ zatca_settings.compliance_request_id|default:'-' }}" readonly>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">شهادة الامتثال (Binary Security Token)</label>
                    <textarea class="form-control" rows="2" readonly>{{ zatca_settings.binary_security_token|default:'-' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">حالة الربط الحالية</label>
                    <input type="text" class="form-control" value="{{ zatca_settings.get_status_display }}" readonly>
                </div>
            </div>

<div class="d-flex gap-2">
    <button type="submit" name="action" value="save" class="btn btn-custom-save">حفظ الإعدادات</button>
    
    <button type="submit" name="action" value="start_onboarding" class="btn btn-primary">بدء التسجيل</button>
</div>
        </form>
    </div>
</div>
{% endblock %}
