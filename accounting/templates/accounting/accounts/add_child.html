{% load i18n %}

{% extends "layout/base.html" %}

{% block title %}{% trans "Add Account Branch" %}{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <!-- العنوان -->
            <h4 class="fw-bold mb-4 text-end">
                {% blocktrans %}Add branch under account: {{ parent.name }}{% endblocktrans %}
            </h4>

            <form method="post">
                {% csrf_token %}

                <!-- اسم الحساب -->
                <div class="mb-3 text-end">
                    <label class="form-label fw-bold">{% trans "Account Name" %}</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ form.name.value|default_if_none:'' }}"
                        required
                    >
                </div>

                <!-- الرمز -->
                <div class="mb-4 text-end">
                    <label class="form-label fw-bold">{% trans "Code" %}</label>
                    <input
                        type="text"
                        class="form-control"
                        value="{{ auto_code }}"
                        readonly
                    >
                </div>

                <!-- الأزرار -->
                <div class="d-flex gap-2 justify-content-end">

                    <button type="submit" class="btn btn-secondary">
                        {% trans "Add" %}
                    </button>

                    <a href="{% url 'accounting:account_view' parent.pk %}"
                       class="btn btn-secondary">
                        {% trans "Cancel" %}
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
