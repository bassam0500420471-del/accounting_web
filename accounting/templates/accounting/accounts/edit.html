{% load i18n %}

{% extends "layout/base.html" %}

{% block content %}

<h3 class="fw-bold mb-3">{% trans "Edit Account" %}</h3>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">{% trans "Account Name" %}</label>
        <input type="text" name="name" class="form-control" value="{{ account.name }}">
    </div>

    <div class="mb-3">
        <label class="form-label">{% trans "Code" %}</label>
        <input type="text" name="code" class="form-control" value="{{ account.code }}">
    </div>

    <button class="btn btn-primary">{% trans "Save" %}</button>

    <a href="{% url 'accounting:chart_tree' %}" class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>

</form>

{% endblock %}
