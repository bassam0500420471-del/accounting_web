{% extends "layout/base.html" %}
{% load i18n %}

{% block content %}

<div class="container-fluid accounts-page mt-4">

    <div class="account-card">

        <!-- ============================= -->
        <!-- رأس الصفحة -->
        <!-- ============================= -->

        <div class="page-header">

            <div>

                <h3>

                    <i class="fa-solid fa-pen-to-square"></i>

                    {% trans "Edit Account" %}

                </h3>

                <p>
                    {% trans "Edit Account" %}
                </p>

            </div>

        </div>


        <!-- ============================= -->
        <!-- النموذج -->
        <!-- ============================= -->

        <form method="post">

            {% csrf_token %}


            <div class="form-box">


                <!-- اسم الحساب -->

                <div class="form-group">

                    <label class="form-label">

                        <i class="fa-solid fa-file-signature"></i>

                        {% trans "Account Name" %}

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control custom-input"
                        value="{{ account.name }}"
                    >

                </div>


                <!-- الرمز -->

                <div class="form-group">

                    <label class="form-label">

                        <i class="fa-solid fa-hashtag"></i>

                        {% trans "Code" %}

                    </label>

                    <input
                        type="text"
                        name="code"
                        class="form-control custom-input"
                        value="{{ account.code }}"
                        readonly
                    >

                </div>


            </div>


            <!-- ============================= -->
            <!-- الأزرار -->
            <!-- ============================= -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="action-btn save-btn"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    {% trans "Save" %}

                </button>


                <a
                    href="{% url 'accounting:chart_tree' %}"
                    class="action-btn cancel-btn"
                >

                    <i class="fa-solid fa-xmark"></i>

                    {% trans "Cancel" %}

                </a>

            </div>


        </form>

    </div>

</div>


<style>

/* =========================================================
   الخلفية العامة
========================================================= */

body{

    background:#eeeeee;

}


/* =========================================================
   الصفحة
========================================================= */

.accounts-page{

    background:
    linear-gradient(
        135deg,
        #f8f8f8,
        #d5d5d5
    );

    min-height:90vh;

    padding:25px;

}


/* =========================================================
   الكرت الرئيسي
========================================================= */

.account-card{

    background:white;

    border-radius:22px;

    padding:30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.15);

}


/* =========================================================
   رأس الصفحة
========================================================= */

.page-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.page-header h3{

    font-weight:800;

    color:#444;

    margin-bottom:5px;

}


.page-header h3 i{

    color:#666;

    margin-left:5px;

}


.page-header p{

    color:#777;

    margin:0;

}


/* =========================================================
   صندوق النموذج
========================================================= */

.form-box{

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #f5f5f5
    );

    border:1px solid #e0e0e0;

    border-radius:18px;

    padding:25px;

    box-shadow:
    0 8px 20px rgba(0,0,0,.08),
    inset 0 1px 1px rgba(255,255,255,.8);

}


/* =========================================================
   مجموعة الحقل
========================================================= */

.form-group{

    margin-bottom:22px;

}


.form-group:last-child{

    margin-bottom:0;

}


/* =========================================================
   العناوين
========================================================= */

.form-label{

    display:block;

    margin-bottom:9px;

    font-weight:700;

    color:#444;

}


.form-label i{

    color:#777;

    margin-left:5px;

}


/* =========================================================
   الحقول
========================================================= */

.custom-input{

    width:100%;

    padding:12px 14px;

    border:1px solid #aaa;

    border-radius:10px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #e8e8e8
    );

    color:#444;

    box-shadow:
    inset 0 2px 4px rgba(0,0,0,.08),
    0 2px 4px rgba(0,0,0,.06);

    transition:.3s;

}


.custom-input:focus{

    outline:none;

    border-color:#666;

    box-shadow:
    0 0 0 3px rgba(100,100,100,.12),
    inset 0 2px 4px rgba(0,0,0,.08);

}


.custom-input[readonly]{

    background:
    linear-gradient(
        145deg,
        #eeeeee,
        #d8d8d8
    );

    color:#666;

    cursor:not-allowed;

}


/* =========================================================
   الأزرار
========================================================= */

.form-actions{

    display:flex;

    gap:12px;

    margin-top:25px;

}


/* =========================================================
   الزر الأساسي
========================================================= */

.action-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    padding:11px 22px;

    border-radius:12px;

    text-decoration:none;

    border:0;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 5px 10px rgba(0,0,0,.20),
    inset 0 1px 1px rgba(255,255,255,.20);

}


/* =========================================================
   حفظ
========================================================= */

.save-btn{

    background:
    linear-gradient(
        135deg,
        #666,
        #444
    );

    color:white;

}


.save-btn:hover{

    background:
    linear-gradient(
        135deg,
        #555,
        #333
    );

    color:white;

    transform:translateY(-2px);

    box-shadow:
    0 8px 15px rgba(0,0,0,.25);

}


/* =========================================================
   إلغاء
========================================================= */

.cancel-btn{

    background:
    linear-gradient(
        135deg,
        #eeeeee,
        #cccccc
    );

    color:#444;

}


.cancel-btn:hover{

    background:
    linear-gradient(
        135deg,
        #dddddd,
        #bbbbbb
    );

    color:#333;

    transform:translateY(-2px);

}


/* =========================================================
   الشاشات الصغيرة
========================================================= */

@media(max-width:768px){

    .accounts-page{

        padding:15px;

    }


    .account-card{

        padding:18px;

    }


    .page-header{

        flex-direction:column;

        align-items:stretch;

        gap:10px;

        text-align:center;

    }


    .form-box{

        padding:18px;

    }


    .form-actions{

        flex-direction:column;

    }


    .action-btn{

        width:100%;

    }

}

</style>

{% endblock %}
