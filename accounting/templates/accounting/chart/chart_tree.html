{% extends "layout/base.html" %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

{% block content %}

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- jsTree -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jstree@3.3.15/dist/themes/default/style.min.css">
<script src="https://cdn.jsdelivr.net/npm/jstree@3.3.15/dist/jstree.min.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
    #chartTree {
        direction: {% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %};
        font-size: 18px;
        line-height: 1.9;
    }

    .tree-row {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 8px;
    }

    .tree-actions {
        margin-left: auto;
        display: none;
        gap: 10px;
    }

    .tree-actions i {
        cursor: pointer;
        font-size: 14px;
        color: #6c757d;
    }

    .tree-actions i:hover {
        color: #0d6efd;
    }

    .tree-actions .delete {
        color: #dc3545;
    }

    .jstree-anchor:hover .tree-actions {
        display: inline-flex;
    }
</style>

<div class="container mt-4">
    <div class="card">
        <div class="card-body">

            <h4 class="fw-bold text-end mb-3">
                {% trans "Chart of Accounts Tree" %}
            </h4>

            <div id="chartTree"></div>

        </div>
    </div>
</div>

<script>
$(function () {

    const LANG = "{{ LANGUAGE_CODE }}";

    const tree = $("#chartTree").jstree({
        core: {
            data: {
                url: "{% url 'accounting:chart_tree_api' %}",
                data: function (node) {
                    return { id: node.id };
                },
                dataType: "json"
            },
            themes: { dots: true, icons: true }
        },
        plugins: ["wholerow"],
        rtl: LANG === "ar"
    });

    function addActions() {
        $("#chartTree li").each(function () {
            const $li = $(this);
            if ($li.find(".tree-actions").length) return;

            const node = tree.jstree(true).get_node($li.attr("id"));
            if (!node) return;

            if (node.parent === "#") return;

            const id = node.id;

            let actions = `<span class="tree-actions">

                <i class="fa fa-eye"
                   title="{% trans 'View' %}"
                   onclick="window.location.href='/accounting/accounts/${id}/view/'"></i>

                <i class="fa fa-plus"
                   title="{% trans 'Add Child' %}"
                   onclick="window.location.href='/accounting/accounts/${id}/add-child/'"></i>
            `;

            if (!node.children || node.children.length === 0) {
                actions += `<i class="fa fa-trash delete"
                   title="{% trans 'Delete' %}"
                   onclick="if(confirm('{% trans 'Confirm delete?' %}')) {
                       window.location.href='/accounting/accounts/${id}/delete/';
                   }"></i>`;
            }

            actions += "</span>";

            const textEl = $li.find("> .jstree-anchor");
            if (!textEl.find(".tree-row").length) {
                textEl.wrapInner('<span class="tree-row"></span>');
                textEl.find(".tree-row").append(actions);
            }
        });
    }

    $("#chartTree").on("ready.jstree open_node.jstree refresh.jstree", function () {
        addActions();
    });

});
</script>

{% endblock %}
