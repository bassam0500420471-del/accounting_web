{% extends "layout/base.html" %}
{% block content %}

<style>
.btn-main {
    background:#6c757d;
    color:#fff;
    border-radius:6px;
    height:34px;
    font-size:14px;
    padding:0 16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:none;
}
.btn-main:hover {
    background:#5c636a;
    color:#fff;
}

.balance-ok {
    color:#198754;
    font-weight:bold;
}
.balance-bad {
    color:#dc3545;
    font-weight:bold;
}

/* ================= Select2 نفس شكل form-control ================= */
.select2-container {
    width: 100% !important;
}

.select2-container--default .select2-selection--single {
    height: 38px !important;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #ced4da;
    font-size: 14px;
    display: flex;
    align-items: center;
}

.select2-selection__rendered {
    line-height: normal !important;
    padding-right: 0 !important;
}

.select2-selection__arrow {
    height: 36px !important;
}
</style>

<div class="container mt-4">

    <!-- العنوان -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">إضافة قيد يومي يدوي</h3>

        <a href="{% url 'accounting:journals_list' %}" class="btn-main">
            رجوع
        </a>
    </div>

    <form method="post" id="journalForm">
        {% csrf_token %}

        <!-- رأس القيد -->
        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="fw-bold">التاريخ</label>
                        <input type="date"
                               name="date"
                               id="journalDate"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-9">
                        <label class="fw-bold">البيان</label>
                        <input type="text"
                               name="description"
                               class="form-control"
                               placeholder="اكتب بيان القيد"
                               required>
                    </div>
                </div>
            </div>
        </div>

        <!-- سطور القيد -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-bordered text-center align-middle mb-0" id="linesTable">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>الحساب</th>
                            <th>مدين</th>
                            <th>دائن</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- سطر 1 -->
                        <tr>
                            <td>1</td>
                            <td class="text-start">
                                <select name="row_1_account" class="form-select account-select">
                                    <option value="">— اختر الحساب —</option>
                                    {% for a in accounts %}
                                        <option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <input type="number" step="0.01" name="row_1_debit" class="form-control debit">
                            </td>
                            <td>
                                <input type="number" step="0.01" name="row_1_credit" class="form-control credit">
                            </td>
                        </tr>

                        <!-- سطر 2 -->
                        <tr>
                            <td>2</td>
                            <td class="text-start">
                                <select name="row_2_account" class="form-select account-select">
                                    <option value="">— اختر الحساب —</option>
                                    {% for a in accounts %}
                                        <option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <input type="number" step="0.01" name="row_2_debit" class="form-control debit">
                            </td>
                            <td>
                                <input type="number" step="0.01" name="row_2_credit" class="form-control credit">
                            </td>
                        </tr>
                    </tbody>

                    <tfoot>
                        <tr class="fw-bold">
                            <td colspan="2">الإجمالي</td>
                            <td id="totalDebit">0.00</td>
                            <td id="totalCredit">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <input type="hidden" name="total_rows" id="totalRows" value="2">

        <!-- الأزرار -->
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button type="button" class="btn-main" onclick="addRow()">
                ➕ إضافة سطر
            </button>

            <div id="balanceMsg"></div>

            <button type="submit" class="btn-main" id="saveBtn" disabled>
                💾 حفظ القيد
            </button>
        </div>

    </form>
</div>

<!-- ================= JS ================= -->

<script>
document.getElementById("journalDate").value =
    new Date().toISOString().split("T")[0];

let totalRows = 2;

function addRow() {
    totalRows++;
    document.getElementById("totalRows").value = totalRows;

    const tbody = document.querySelector("#linesTable tbody");
    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${totalRows}</td>
        <td class="text-start">
            <select name="row_${totalRows}_account" class="form-select account-select">
                <option value="">— اختر الحساب —</option>
                {% for a in accounts %}
                    <option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>
                {% endfor %}
            </select>
        </td>
        <td><input type="number" step="0.01" name="row_${totalRows}_debit" class="form-control debit"></td>
        <td><input type="number" step="0.01" name="row_${totalRows}_credit" class="form-control credit"></td>
    `;
    tbody.appendChild(row);

    $('.account-select').select2({ width:'100%', dir:'rtl' });
}

function calculateBalance() {
    let debit = 0, credit = 0;

    document.querySelectorAll(".debit").forEach(i => debit += parseFloat(i.value) || 0);
    document.querySelectorAll(".credit").forEach(i => credit += parseFloat(i.value) || 0);

    document.getElementById("totalDebit").innerText = debit.toFixed(2);
    document.getElementById("totalCredit").innerText = credit.toFixed(2);

    const msg = document.getElementById("balanceMsg");
    const saveBtn = document.getElementById("saveBtn");

    if (debit === 0 && credit === 0) {
        msg.innerHTML = "";
        saveBtn.disabled = true;
        return;
    }

    if (debit !== credit) {
        msg.innerHTML =
            `<span class="balance-bad">❌ غير متوازن (الفرق ${Math.abs(debit-credit).toFixed(2)})</span>`;
        saveBtn.disabled = true;
    } else {
        msg.innerHTML =
            `<span class="balance-ok">✔️ قيد متوازن</span>`;
        saveBtn.disabled = false;
    }
}

document.addEventListener("input", calculateBalance);
</script>

<!-- ================= Select2 ================= -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function () {
    $('.account-select').select2({
        width: '100%',
        dir: 'rtl'
    });
});
</script>

{% endblock %}
