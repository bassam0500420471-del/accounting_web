{% extends "layout/base.html" %}

{% block title %}تعديل المخزون يدويًا{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

<style>
    #current_stock, #final_stock {
        background: #f7f7f7;
    }
    .qty-wrapper {
        display: flex;
        gap: 5px;
        align-items: center;
    }
    .qty-wrapper select {
        width: 60px;
        height: 38px;
    }
    .qty-wrapper input {
        flex: 1;
        height: 38px;
        text-align: right;
    }
</style>
{% endblock %}

{% block content %}
<h2 class="mb-4">تعديل المخزون يدويًا</h2>

<form method="post" class="row g-3" id="stockForm">
    {% csrf_token %}

    <!-- المنتج -->
    <div class="col-md-6">
        <label class="form-label">المنتج</label>
        <select id="product_id" name="product_id" class="form-select" required>
            <option value="">اختر المنتج</option>
            {% for p in products %}
                <option value="{{ p.id }}" data-stock="{{ p.current_stock }}">
                    {{ p.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- المخزون الحالي -->
    <div class="col-md-6">
        <label class="form-label">المخزون الحالي</label>
        <input type="text" id="current_stock" class="form-control" readonly>
    </div>

    <!-- التعديل -->
    <div class="col-md-6">
        <label class="form-label">التعديل (+ / -)</label>
        <div class="qty-wrapper">
            <select id="qty_sign" name="qty_sign" required>
                <option value="+">+</option>
                <option value="-">-</option>
            </select>
            <input type="number" id="qty_value" name="qty_delta" min="1">
        </div>
    </div>

    <!-- الكمية بعد التعديل -->
    <div class="col-md-6">
        <label class="form-label">الكمية بعد التعديل</label>
        <input type="text" id="final_stock" name="final_stock" class="form-control" readonly>
    </div>

    <!-- النوع -->
    <div class="col-md-6">
        <label class="form-label">النوع</label>
        <select id="reason_id" name="reason_id" class="form-select" required>
            <option value="">اختر</option>
            {% for r in reasons %}
                <option value="{{ r.id }}">{{ r.name }}</option>
            {% endfor %}
            <option value="OTHER">أخرى</option>
        </select>
    </div>

    <!-- نوع جديد -->
    <div class="col-md-6" id="custom_reason_wrapper" style="display:none;">
        <label class="form-label">نوع جديد</label>
        <input type="text" id="custom_reason" class="form-control">
        <button type="button" class="btn btn-info mt-2" id="openModal">إضافة نوع جديد</button>
    </div>

    <!-- ملاحظات -->
    <div class="col-md-12">
        <label class="form-label">ملاحظات</label>
        <textarea name="note" class="form-control" rows="3"></textarea>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-secondary">تنفيذ</button>
    </div>
</form>

<!-- Modal إضافة نوع -->
<div class="modal fade" id="addTypeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">إضافة نوع جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">النوع الجديد</label>
                <input type="text" id="new_type" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button class="btn btn-primary" id="saveNewType">حفظ</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- jQuery لازم قبل أي كود jQuery -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {

    $('#product_id').select2({
        placeholder: "اختر المنتج",
        width: '100%'
    });

    // عند اختيار المنتج: يظهر المخزون الحالي فقط
    $('#product_id').on('change', function () {
        const stock = parseInt($(this).find(':selected').data('stock')) || 0;
        $('#current_stock').val(stock);
        $('#final_stock').val('');
        $('#qty_value').val('');
        $('#qty_sign').val('+');
    });

    // دالة لحساب المخزون بعد التعديل
    function calculateFinal() {
        const current = parseInt($('#current_stock').val()) || 0;
        const qty = parseInt($('#qty_value').val()) || 0;
        const sign = $('#qty_sign').val();
        if (qty) {
            const finalQty = sign === '+' ? current + qty : current - qty;
            $('#final_stock').val(finalQty);
        } else {
            $('#final_stock').val('');
        }
    }

    // تفعيل الحساب عند إدخال كمية أو تغيير الإشارة
    $('#qty_value, #qty_sign').on('input change', calculateFinal);

    // التحكم بعرض نوع جديد
    $('#reason_id').change(function () {
        if ($(this).val() === 'OTHER') {
            $('#custom_reason_wrapper').show();
        } else {
            $('#custom_reason_wrapper').hide();
        }
    });

    // فتح المودال
    $('#openModal').click(function () {
        if (!$('#custom_reason').val()) {
            alert('أدخل نوع جديد أولاً');
            return;
        }
        new bootstrap.Modal(document.getElementById('addTypeModal')).show();
    });

    // حفظ النوع الجديد
    $('#saveNewType').click(function () {
        const val = $('#new_type').val();
        if (!val) {
            alert('أدخل نوع جديد');
            return;
        }
        $('#reason_id').append(new Option(val, val)).val(val);
        bootstrap.Modal.getInstance(document.getElementById('addTypeModal')).hide();
    });

});
</script>
{% endblock %}
