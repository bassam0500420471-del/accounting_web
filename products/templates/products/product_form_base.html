<div class="row mb-3">
    <div class="col-md-6">
        <label>اسم المنتج</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="col-md-6">
        <label>الكود (SKU)</label>
        <input type="text" name="sku" class="form-control">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label>سعر الشراء</label>
        <input type="number" step="0.01" name="purchase_price" class="form-control" value="0">
    </div>

    <div class="col-md-6">
        <label>سعر البيع</label>
        <input type="number" step="0.01" name="sale_price" class="form-control" value="0">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label>حد أدنى للمخزون</label>
        <input type="number" name="min_stock" class="form-control" value="0">
    </div>

    <div class="col-md-6">
        <label>تنبيه عند النفاد</label>
        <input type="number" name="alert_stock" class="form-control" value="0">
    </div>
</div>

<div class="mb-3">
    <label>الوصف</label>
    <textarea name="description" class="form-control"></textarea>
</div>

<div class="mb-3">
    <label>صورة</label>
    <input type="file" name="image" class="form-control">
</div>
