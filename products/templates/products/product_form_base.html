{% load i18n %}

<div class="row mb-3">
    <div class="col-md-6">
        <label>{% trans "Product Name" %}</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="col-md-6">
        <label>{% trans "SKU" %}</label>
        <input type="text" name="sku" class="form-control">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label>{% trans "Purchase Price" %}</label>
        <input type="number" step="0.01" name="purchase_price" class="form-control" value="0">
    </div>

    <div class="col-md-6">
        <label>{% trans "Sale Price" %}</label>
        <input type="number" step="0.01" name="sale_price" class="form-control" value="0">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label>{% trans "Minimum Stock" %}</label>
        <input type="number" name="min_stock" class="form-control" value="0">
    </div>

    <div class="col-md-6">
        <label>{% trans "Low Stock Alert" %}</label>
        <input type="number" name="alert_stock" class="form-control" value="0">
    </div>
</div>

<div class="mb-3">
    <label>{% trans "Description" %}</label>
    <textarea name="description" class="form-control"></textarea>
</div>

<div class="mb-3">
    <label>{% trans "Image" %}</label>
    <input type="file" name="image" class="form-control">
</div>
