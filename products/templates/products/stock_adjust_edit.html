{% extends "layout/base.html" %}
{% load i18n %}

{% block title %}{% trans "Edit Stock Movement" %}{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">{% trans "Edit Stock Movement" %}</h4>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <!-- Product -->
                <div class="mb-3">
                    <label class="form-label">{% trans "Product" %}</label>

                    <select id="product_id"
                            name="product_id"
                            class="form-select"
                            required>

                        {% for p in products %}
                            <option value="{{ p.id }}"
                                {% if p.id == move.product.id %}selected{% endif %}>
                                {{ p.name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="row">

                    <div class="col-md-3">
                        <label class="form-label">{% trans "Sign" %}</label>

                        <select name="qty_sign" class="form-select">
                            <option value="+"
                                {% if move.qty_delta >= 0 %}selected{% endif %}>
                                +
                            </option>

                            <option value="-"
                                {% if move.qty_delta < 0 %}selected{% endif %}>
                                -
                            </option>
                        </select>
                    </div>

                    <div class="col-md-9">
                        <label class="form-label">{% trans "Quantity" %}</label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="qty_delta"
                            class="form-control"
                            value="{{ move.qty_delta|floatformat:'-2'|cut:'-' }}">
                    </div>

                </div>

                <div class="mt-3">
                    <label class="form-label">{% trans "Reason" %}</label>

                    <select name="reason_id" class="form-select">

                        {% for reason in reasons %}
                            <option value="{{ reason.id }}"
                                {% if reason.id == move.reason.id %}selected{% endif %}>
                                {{ reason.name }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mt-3">
                    <label class="form-label">{% trans "Notes" %}</label>

                    <textarea
                        name="note"
                        rows="4"
                        class="form-control">{{ move.note }}</textarea>
                </div>

                <div class="mt-4">

                    <button class="btn btn-success" type="submit">
                        {% trans "Save Changes" %}
                    </button>

                    <a href="{% url 'products:stock_ledger' %}"
                       class="btn btn-secondary">
                        {% trans "Cancel" %}
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function () {

    $('#product_id').select2({
        placeholder: "{% trans 'ابحث عن المنتج...' %}",
        allowClear: true,
        width: '100%',
        dir: 'rtl'
    });

});
</script>
{% endblock %}
