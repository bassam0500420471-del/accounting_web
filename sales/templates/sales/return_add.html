{% extends "layout/base.html" %}
{% load i18n %}
{% block content %}

<style>
.btn-main {
    background:#6c757d !important;
    color:white !important;
    border-radius:6px;
    font-size:18px;
    padding:10px 25px;
}
.btn-main:hover {
    background:#5c636a !important;
}
</style>

<div class="container mt-4">

    <h2 class="fw-bold text-center mb-4">
        {% trans "Create Credit Note (Sales Return)" %}
    </h2>

    <!-- ================= Customer ================= -->
    <label class="fw-bold">{% trans "Select Customer:" %}</label>
    <select id="customerSelect" class="form-select mb-3">
        <option value="">{% trans "-- Select Customer --" %}</option>
        {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
    </select>

    <!-- ================= Invoice ================= -->
    <label class="fw-bold">{% trans "Select Sales Invoice:" %}</label>
    <select id="invoiceSelect" class="form-select mb-4" disabled>
        <option value="">{% trans "-- Select customer first --" %}</option>
    </select>

    <!-- ================= Continue ================= -->
    <div class="text-center mt-4">
        <a id="continueBtn"
           class="btn-main btn-lg disabled"
           role="button">
            {% trans "Continue Creating Return" %}
        </a>
    </div>

</div>

<script>
// =================================================
// Select Customer → Load Sales Invoices
// =================================================
document.getElementById("customerSelect").addEventListener("change", function () {

    const customerId    = this.value;
    const invoiceSelect = document.getElementById("invoiceSelect");

    invoiceSelect.disabled = true;
    invoiceSelect.innerHTML = "<option>{% trans 'Loading...' %}</option>";

    if (!customerId) {
        invoiceSelect.innerHTML = "<option>{% trans '-- Select customer first --' %}</option>";
        return;
    }

    fetch(`/sales/api/invoices/by-customer/?customer_id=${customerId}`)
        .then(res => res.json())
        .then(data => {

            invoiceSelect.innerHTML = "<option value=''>{% trans '-- Select invoice --' %}</option>";
            invoiceSelect.disabled = false;

            data.invoices.forEach(inv => {
                invoiceSelect.innerHTML += `
                    <option value="${inv.id}">
                        {% trans "Invoice No." %} ${inv.invoice_no}
                        | ${inv.total} {% trans "SAR" %}
                        | ${inv.date}
                    </option>
                `;
            });
        });
});


// =================================================
// Select Invoice → Enable Continue Button
// =================================================
document.getElementById("invoiceSelect").addEventListener("change", function () {

    const invoiceId = this.value;
    const btn       = document.getElementById("continueBtn");

    if (!invoiceId) {
        btn.classList.add("disabled");
        btn.removeAttribute("href");
        return;
    }

    btn.classList.remove("disabled");

    // 🔁 Same logic as purchases
    btn.href = "{% url 'sales:create_return' 0 %}".replace("/0/", `/${invoiceId}/`);
});
</script>

{% endblock %}
